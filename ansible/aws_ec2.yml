plugin: amazon.aws.aws_ec2
regions:
  - ap-south-1

# Ask AWS for the running instances of this project, every single run
filters:
  tag:Project: mongo-demo
  instance-state-name: running

hostnames:
  - tag:Name

keyed_groups:
  - key: ec2_tags.Role          # creates the group "role_mongodb"
    prefix: role

compose:
  ansible_host: instance_id                  # SSM connects using the instance ID
  ansible_aws_ssm_region: placement.region
  ansible_aws_ssm_bucket_name: ec2_tags.SsmBucket
  ansible_aws_ssm_timeout: 120
  mongo_node_index: ec2_tags.NodeIndex
  mongo_private_ip: private_ip_address       # the current IP
